services:
    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_BIND_PORT:-5432}:5432"
        healthcheck:
            test: [CMD-SHELL, "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
        volumes:
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:
