name: ci

on: push

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18.6-alpine
                env:
                    POSTGRES_DB: booking
                    POSTGRES_USER: booking
                    POSTGRES_PASSWORD: booking
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U booking -d booking"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 5

        env:
            DATABASE_URL: postgres://booking:booking@localhost:5432/booking

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: make install
            - run: make build
            - run: make lint
            - run: make test
